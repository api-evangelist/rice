providerId: rice
generated: '2026-09-01'
method: probed
authorship: >-
  This artifact was generated by API Evangelist from live public probes on 2026-09-01. It is not published by Rice University and Rice did not author it.
source: >-
  Live error probes on 2026-09-01 of the Kinder Institute Urban Data Platform API
  (https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod), the Rice Research
  Repository DSpace REST API (https://repository.rice.edu/server/api) and the Rice
  course schedule (https://courses.rice.edu). Rice publishes no error reference for any
  of these surfaces. Every entry below is an OBSERVED response, not a documented one.
description: >-
  What Rice's public surfaces actually return when a request goes wrong. The finding that
  matters is on the one API Rice itself operates: the Urban Data Platform answers an unknown
  dataset identifier with HTTP 200 and a raw AWS Lambda runtime error, so a client that
  branches on status code will treat a failure as a success and then fail on the parse.
apis:
- aid: rice:kinder-udp
  name: Kinder Institute Urban Data Platform API
  x-operator: institution
  envelope:
    shape: >-
      There is no common envelope. Success is a bare JSON object or a bare JSON array;
      failure is whichever of three unrelated shapes the failing layer happens to produce
      (API Gateway router, Lambda authorizer, Lambda runtime).
    content_type: application/json
  errors:
  - status: 200
    severity: defect
    trigger: An unknown or malformed datasetId on GET /datasets/{datasetId}.
    body: '{"errorMessage": "Unable to marshal response: Object of type AttributeError is not JSON serializable", "errorType": "Runtime.MarshalError", "requestId": "...", "stackTrace": []}'
    note: >-
      The handler raises an unhandled AttributeError on a missing record and Lambda's own
      marshalling then fails, which API Gateway passes through as 200. Two consequences for a
      consumer: a not-found is indistinguishable from a hit by status code, and the response
      leaks the runtime's internal failure mode and requestId. This is the single most
      consequential defect on Rice's only self-operated public API.
    evidence:
      url: https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod/datasets/zzzznotreal
      status: 200
      size_bytes: 210
  - status: 401
    trigger: An anonymous GET of the member-scoped catalog at /user/catalog.
    body: '{"message":"Unauthorized"}'
    note: >-
      The API Gateway Lambda authorizer's own envelope. No WWW-Authenticate header, no error
      code, no documentation URL — a client cannot learn from the response how to authenticate.
    evidence:
      url: https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod/user/catalog
      status: 401
  - status: 403
    trigger: Any path the API Gateway stage does not route, including the stage root itself.
    body: '{"message":"Missing Authentication Token"}'
    note: >-
      The stock API Gateway response for an unrouted path. It reads as an authentication
      problem and is actually a 404, which is a well-known API Gateway trap; Rice has not
      overridden it. There is no service root document.
    evidence:
      url: https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod/
      status: 403
- aid: rice:repository-rest
  name: Rice Research Repository REST API
  x-operator: tenant
  note: >-
    Listed for the consumer's benefit only. This contract and its error semantics are
    DSpace's, served from DSpaceDirect (Lyrasis) infrastructure at rice.dspacedirect.org, and
    are not Rice's engineering. See conformance/rice-education-standards-conformance.yml.
  errors:
  - status: 202
    severity: caution
    trigger: A browser-shaped GET of the repository UI root https://repository.rice.edu/.
    content_type: text/html
    note: >-
      An AWS WAF challenge page returned with HTTP 202 rather than 403. Callers that grade a
      surface on status alone will read the challenge as a success. The /server/api JSON
      surface behind it is not challenged and answers 200 cleanly.
    evidence:
      url: https://repository.rice.edu/
      status: 202
- aid: rice:course-schedule
  name: Rice University Course Schedule
  x-operator: institution
  errors:
  - status: 406
    severity: caution
    trigger: >-
      Any unknown path on the main Drupal estate (www.rice.edu, news.rice.edu,
      profiles.rice.edu, registrar.rice.edu deep paths).
    content_type: none (zero-length body)
    note: >-
      Rice's main web estate answers an unrecognised path with a zero-length 406 rather than a
      404. This matters for anyone probing Rice programmatically: a 406 here is Rice's
      "not found", NOT a bot block and NOT a content-negotiation failure. It was verified by
      contrast — https://www.rice.edu/robots.txt and /sitemap.xml both return 200 to the same
      client, so the surface is not refusing the agent, only the path. Nothing was concluded
      about llms.txt or .well-known from the status code alone.
    evidence:
    - url: https://www.rice.edu/thisdoesnotexist-xyz
      status: 406
    - url: https://www.rice.edu/robots.txt
      status: 200
    - url: https://www.rice.edu/sitemap.xml
      status: 200
