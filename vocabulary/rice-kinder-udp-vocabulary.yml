description: 'The 27 controlled vocabularies the Rice Kinder Institute Urban Data Platform publishes for
  its own dataset catalog. Two are adoptions of external standards rather than local invention, and both
  are recorded as conformance evidence in conformance/rice-education-standards-conformance.yml: dataciteRelationType
  is the complete DataCite RelationType term list, and iso19115TopicCategory is the complete ISO 19115
  topic-category list. A third, regulatoryLaws, names FERPA first, inside the platform''s own data-governance
  model.'
