method: probed
authorship: >-
  This artifact was generated by API Evangelist from live public probes on 2026-09-01. It is not published by Rice University and Rice did not author it.
source: >-
  Live unauthenticated probes on 2026-09-01 of: the SAML 2.0 EntityDescriptor at
  https://idp.rice.edu/idp/shibboleth; the InCommon per-entity MDQ response for that entityID;
  the OAI-PMH 2.0 endpoint at https://repository.rice.edu/server/oai/request (Identify,
  ListMetadataFormats, ListSets); the DSpace HAL root at https://repository.rice.edu/server/api;
  the DataCite REST API (/providers/rice, /clients?query=rice.edu, /prefixes?provider-id=rice,
  /dois?provider-id=rice); the ROR API; the Crossref members API; and the Kinder Institute
  Urban Data Platform API at https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod.
  Operator for every host was settled by DNS/ARIN/TLS resolution, not by hostname.
description: >-
  Conformance against the Kin Score `education` regime standards list (scim, lti, oneroster,
  ed-fi, caliper, qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref). Reward-only: a
  standard is recorded as conformant for Rice only where an INSTITUTION-OPERATED contract
  demonstrates it. Standards reached only through a vendor platform running under a rice.edu
  hostname are listed separately as tenant-operated, because that conformance belongs to the
  platform's engineering.

  Operator resolution changed the answer twice in this repo, in opposite directions. Rice's
  Shibboleth IdP looks like a documentation link and is in fact a Rice-operated, InCommon-signed
  SAML contract on Rice's own address space — conformant. Rice's research repository looks like a
  rice.edu host and in fact CNAMEs to rice.dspacedirect.org on DSpaceDirect (Lyrasis)
  infrastructure — so its OAI-PMH and DSpace REST conformance is Lyrasis's, not Rice's.
