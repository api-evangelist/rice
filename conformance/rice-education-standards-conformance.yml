not_conformant:
- standard: scim
  status: not_found
  detail: >-
    No SCIM endpoint or SCIM schema reference found on any Rice host. Rice's identity plumbing is
    exposed as SAML, not as a provisioning API.
- standard: lti
  status: not_found
  detail: >-
    No LTI tool registration, platform configuration or JWKS endpoint found on a public Rice
    host. Rice's LMS is Canvas; any LTI conformance there is Instructure's.
- standard: oneroster
  status: not_found
  detail: 'No OneRoster endpoint found. OneRoster adoption is K-12 dominated; a null here is expected.'
- standard: ed-fi
  status: not_found
  detail: 'No Ed-Fi API found. Ed-Fi is a US K-12 state-education-agency standard; not applicable to Rice.'
- standard: caliper
  status: not_found
  detail: 'No Caliper Analytics event endpoint or sensor documentation found on a public Rice host.'
- standard: qti
  status: not_found
  detail: 'No QTI assessment interchange surface found on a public Rice host.'
- standard: orcid
  status: not_found
  detail: >-
    NOT CLAIMED. Rice has no public research-information system exposing ORCID iDs — the DSpace
    repository advertises an ORCID external source at /server/api/integration/externalsources
    (which is DSpace's, not Rice's), and Rice's own experts profile system at experts.rice.edu is
    behind Google Cloud IAP and returned a sign-in redirect, so nothing could be verified. An
    ORCID member-organization record was not evidenced, so no conformance is recorded.
    Recorded as unverifiable rather than absent.
- standard: crossref
  status: not_found
  detail: >-
    No Crossref member record for Rice University was returned by
    https://api.crossref.org/members?query=Rice+University (HTTP 200, zero matching items). Rice's
    DOI registration runs through DataCite, not Crossref, which is the normal pattern for a
    research-data and thesis footprint as opposed to a journal-publishing one.
summary:
  institution_conformant: [saml, shibboleth, datacite]
  tenant_conformant: [oai-pmh]
  not_found: [scim, lti, oneroster, ed-fi, caliper, qti, orcid, crossref]
  note: >-
    Three of the twelve education-regime standards are demonstrated by contracts Rice itself
    operates. A fourth, oai-pmh, is demonstrated on Rice's content but by Lyrasis's software, and
    is deliberately not credited to Rice.
