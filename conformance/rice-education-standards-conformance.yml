- standard: oai-pmh
  name: OAI-PMH 2.0
  status: conformant
  x-operator: tenant
  confidence: high
  operator_note: >-
    TENANT, NOT INSTITUTION. The endpoint answers under repository.rice.edu, but that name is a
    CNAME to rice.dspacedirect.org and resolves to the same three addresses as dspacedirect.org
    (3.149.142.239, 18.227.199.229, 18.226.49.81) behind a platform-provisioned Let's Encrypt
    certificate. The repository, its 2005-onward record set and its administrative contact
    (cds@rice.edu, Rice's Center for Digital Scholarship) are Rice's; the OAI-PMH implementation
    is DSpace's, running on DSpaceDirect (Lyrasis) infrastructure. Rice is credited with
    operating a repository and with the metadata inside it — not with this protocol conformance.
  evidence:
    url: https://repository.rice.edu/server/oai/request?verb=Identify
    status: 200
    content_type: text/xml
    locations:
    - 'Identify/repositoryName = Rice Research Repository'
    - 'Identify/protocolVersion = 2.0'
    - 'Identify/adminEmail = cds@rice.edu'
    - 'Identify/earliestDatestamp = 2005-07-25T21:28:53Z'
