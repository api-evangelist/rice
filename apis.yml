  - aid: rice:course-schedule
    name: Rice University Course Schedule
    x-operator: institution
    description: >-
      Rice's public course catalog and schedule search, served from courses.rice.edu on Rice's
      own network (128.42.207.157, RICENET). It is an Ellucian Banner self-service interface
      (SWKSCAT) with a Rice-authored XSL layer, taking term, subject, department, school, CRN
      and keyword parameters and returning XHTML carrying a Rice-specific XML namespace
      (urn:edu.rice.adminsystems.stud…) rather than JSON. Rice runs the deployment, so the
      operator is institution — but this is a queryable web interface, not a documented API,
      and no contract is claimed for it.
    humanURL: https://courses.rice.edu/
    baseURL: https://courses.rice.edu/admweb/!SWKSCAT.cat
    tags: [ Course Catalog, Registrar, Schedule, Banner, Education ]
    properties:
      - type: Website
        url: https://courses.rice.edu/
      - type: Errors
        url: errors/rice-errors.yml
  - aid: rice:repository-rest
    name: Rice Research Repository (DSpaceDirect tenancy) — REST API
    x-operator: tenant
    description: >-
      The Rice Research Repository (R-3) is Fondren Library's institutional repository, holding
      Rice theses, dissertations and scholarship back to 2005 and minting DOIs on Rice's own
      DataCite prefixes. The repository, its content and its curation are Rice's. The software
      and the contract are not: repository.rice.edu is a CNAME to rice.dspacedirect.org and
      resolves to the same three addresses as dspacedirect.org, behind a platform-provisioned
      Let's Encrypt certificate — it is a DSpaceDirect (Lyrasis) tenancy running DSpace 9.3.
      The tenancy is recorded here because it is a real institutional fact; the DSpace REST
      contract is deliberately NOT saved under Rice, and belongs to DSpace's own catalog entry.
    humanURL: https://repository.rice.edu/
    baseURL: https://repository.rice.edu/server/api
    tags: [ Research Repository, DSpace, DSpaceDirect, Lyrasis, Library, Scholarship, Tenant ]
    properties:
      - type: Website
        url: https://repository.rice.edu/
      - type: Examples
        url: examples/rice-repository-dspace-root-example.json
      - type: Errors
        url: errors/rice-errors.yml
  - aid: rice:repository-oai
    name: Rice Research Repository (DSpaceDirect tenancy) — OAI-PMH
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 harvesting endpoint for the Rice Research Repository. Identify returns
      repositoryName "Rice Research Repository", repositoryIdentifier repository.rice.edu,
      adminEmail cds@rice.edu (Rice's Center for Digital Scholarship) and an earliest datestamp
      of 2005-07-25; ListMetadataFormats returns thirteen prefixes including oai_dc, etdms,
      mods, marc, mets, ore, qdc, rioxx and xoai. The harvestable metadata is Rice's. The
      OAI-PMH implementation serving it is DSpace's, on DSpaceDirect infrastructure, so the
      protocol conformance is recorded as tenant-operated in conformance/ and is not credited
      to Rice.
    humanURL: https://library.rice.edu/services/sharing-research-data-rice-digital-scholarship-archive
    baseURL: https://repository.rice.edu/server/oai/request
    tags: [ OAI-PMH, Metadata, Harvesting, Research Repository, Library, Tenant ]
    properties:
      - type: Documentation
        url: https://repository.rice.edu/server/oai/request?verb=Identify
      - type: Conformance
        url: conformance/rice-education-standards-conformance.yml
