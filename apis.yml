apis:
  - aid: rice:kinder-udp
    name: Rice Kinder Institute Urban Data Platform API
    x-operator: institution
    description: >-
      The only publicly callable API Rice University itself operates. Serves the Kinder
      Institute for Urban Research's Urban Data Platform: a 431-dataset catalog of Houston and
      Harris County urban data across fourteen subject categories, with 27 controlled
      vocabularies, DataCite DOIs under Rice's own 10.25612 prefix, and typed inter-dataset
      relations drawn from the DataCite RelationType vocabulary. Reads are anonymous and
      CORS-open; a member-scoped catalog sits behind an undocumented authorizer. Rice publishes
      no documentation, no OpenAPI and no developer portal for it — the description in this
      repository was written from live probes on 2026-09-01 and is marked `method: probed`.
      Operator is institution despite the AWS hostname: the API's own suggestedCitation field
      names "Rice University-Kinder Institute: UDP", kinder.rice.edu endorses and links the
      platform, and its DOIs resolve to DataCite client RICE.KINDER under member `rice`.
    humanURL: https://kinder.rice.edu/initiative/urban-data-platform
    baseURL: https://lg4tooqkr1.execute-api.us-east-1.amazonaws.com/prod
    tags: [ Open Data, Urban Research, Research Data, Datasets, Geospatial, Houston, REST, JSON ]
    properties:
