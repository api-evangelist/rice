description: >-
  Rice University is a private research university in Houston, Texas. Its programmable
  footprint is small, and most of what appears to be Rice's is not: the Rice Research
  Repository at repository.rice.edu is a CNAME to rice.dspacedirect.org and runs on
  DSpaceDirect, the Lyrasis-hosted DSpace service, so its REST and OAI-PMH contracts are the
  platform's engineering on Rice's content, recorded here as a tenancy rather than credited to
  Rice. What Rice genuinely operates is three things. It runs its own Shibboleth/SAML 2.0
  identity provider at idp.rice.edu, on Rice's own ARIN allocation behind an InCommon-issued
  certificate, and registers it in the InCommon federation — the strongest machine-readable
  contract on Rice's public surface. It is a direct DataCite member (symbol RICE, eight
  prefixes, 2,169 DOIs) through Fondren Library. And its Kinder Institute for Urban Research
  operates the Urban Data Platform, a genuinely public, unauthenticated JSON API serving a
  431-dataset Houston-region urban data catalog with its own controlled vocabularies and
  DataCite DOIs — undocumented, unadvertised, and the only self-operated callable API Rice has.
  There is no central developer portal, no llms.txt, no .well-known catalog, and the official
  RiceUniversity GitHub organization has zero public repositories; Rice's Center for Research
  Computing publishes separately at github.com/rice-crc.
