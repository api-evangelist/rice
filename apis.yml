  - aid: rice:sso-shibboleth
    name: Rice Shibboleth SAML 2.0 Identity Provider
    x-operator: institution
    description: >-
      Rice University's own Shibboleth/SAML 2.0 identity provider, publishing a live
      EntityDescriptor with an IDPSSODescriptor, a shibmd:Scope of rice.edu and support for
      SAML 1.1, SAML 2.0 and the Shibboleth 1.0 protocol. Operator was settled by
      infrastructure, not hostname: idp.rice.edu resolves to 128.42.207.19 on Rice's own
      RICENET allocation, behind a certificate issued to William Marsh Rice University by
      Internet2's InCommon CA. This is Rice's engineering and the strongest machine-readable
      contract on its public surface.
    humanURL: https://idp.rice.edu/idp/shibboleth
    baseURL: https://idp.rice.edu/idp/shibboleth
    tags: [ Identity, SSO, SAML, Shibboleth, Authentication, Federation ]
    properties:
      - type: Documentation
        url: https://idp.rice.edu/idp/shibboleth
      - type: IdentityFederation
        url: identity-federation/rice-identity-federation.yml
      - type: Authentication
        url: authentication/rice-authentication.yml
      - type: Conformance
        url: conformance/rice-education-standards-conformance.yml
  - aid: rice:incommon-federation
    name: InCommon Federation registration
    x-operator: federation
    description: >-
      Rice's identity provider is registered in InCommon, the US research and education
      identity federation, and InCommon's metadata query service returns a signed
      EntityDescriptor for entityID https://idp.rice.edu/idp/shibboleth with
      registrationAuthority https://incommon.org. A federation is shared by definition; the
      entity inside it is Rice's, and this membership is what makes Rice's IdP usable by every
      other InCommon participant. Recorded as a relationship, never as Rice's contract.
    humanURL: https://spaces.at.internet2.edu/spaces/federation/overview
    baseURL: https://mdq.incommon.org/
    tags: [ Identity Federation, InCommon, SAML, Metadata, Higher Education ]
    properties:
      - type: IdentityFederation
        url: identity-federation/rice-identity-federation.yml
      - type: Documentation
        url: https://mdq.incommon.org/entities/%7Bsha1%7D6353fefaff3eca405b039ff0391042ae469fc046
  - aid: rice:datacite
    name: DataCite membership — Fondren Library, Rice University
    x-operator: registry
    description: >-
      Rice University is a DataCite direct member, registered 2017-11-13 as provider `rice`
      (symbol RICE) under Fondren Library and linked to ROR https://ror.org/008zs3103. The
      membership carries eight DOI prefixes (10.25611 through 10.25618) and 2,169 registered
      DOIs across three repositories: Fondren Library (rice.fondren), the Kinder Institute
      Urban Data Platform (rice.kinder) and the Children's Environmental Health Initiative
      (rice.cehi). This is a fact about Rice, not a Rice contract — DataCite's own API is
      never saved here, and the membership is never deleted to tidy a shared host.
    humanURL: https://library.rice.edu/
    baseURL: https://api.datacite.org/providers/rice
    tags: [ DataCite, DOI, Persistent Identifiers, Registry, Research Data, Membership ]
    properties:
      - type: Conformance
        url: conformance/rice-education-standards-conformance.yml
      - type: Documentation
        url: https://api.datacite.org/providers/rice
  - aid: rice:ror
    name: ROR registration — Rice University
    x-operator: registry
    description: >-
      Rice University's entry in the Research Organization Registry, ROR ID
      https://ror.org/008zs3103. It is the identifier DataCite's member record for Fondren
      Library points at, and the canonical machine-readable identity for the institution
      across the research-data ecosystem. A registry membership, recorded as a relationship.
    humanURL: https://ror.org/008zs3103
    baseURL: https://api.ror.org/v2/organizations/008zs3103
    tags: [ ROR, Registry, Persistent Identifiers, Research Organization, Membership ]
    properties:
